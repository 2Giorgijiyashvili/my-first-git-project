<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Request Form</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
    
    
    
  <main class="form-card">
    <header class="brand">✹ ABC Solutions</header>
    <h1>SERVICE REQUEST FORM</h1>

    <form>
      <section>
        <h2>Customer Information</h2>
        <div class="grid">
          <div class="field">
            <label for="customer-name">Customer Name:</label>
            <input id="customer-name" name="customerName" type="text">
          </div>

          <div class="field">
            <label for="contact-number">Contact Number:</label>
            <input id="contact-number" name="contactNumber" type="tel">
          </div>

          <div class="field">
            <label for="home-address">Home Address:</label>
            <input id="home-address" name="homeAddress" type="text">
          </div>

          <div class="field">
            <label for="email-address">Email Address:</label>
            <input id="email-address" name="emailAddress" type="email">
          </div>
        </div>
      </section>

      <section>
        <h2>Service Request Details</h2>

        <label>Requested:</label>
        <div class="options">
          <label><input type="radio" name="requestType" value="repair"> Repair</label>
          <label><input type="radio" name="requestType" value="maintenance"> Maintenance</label>
          <label><input type="radio" name="requestType" value="installation"> Installation</label>
          <label><input type="radio" name="requestType" value="other"> Other</label>
        </div>

        <div class="field full-width">
          <label for="service-description">Description of Service Requested:</label>
          <textarea id="service-description" name="serviceDescription"></textarea>
        </div>

        <div class="field full-width">
          <label for="requested-date">Date and Time Requested:</label>
          <input id="requested-date" name="requestedDate" type="datetime-local">
        </div>

        <label class="full-width">Urgency Level:</label>
        <div class="options">
          <label><input type="radio" name="urgency" value="low"> Low</label>
          <label><input type="radio" name="urgency" value="medium"> Medium</label>
          <label><input type="radio" name="urgency" value="high"> High</label>
          <label><input type="radio" name="urgency" value="emergency"> Emergency</label>
        </div>
      </section>

      <section>
        <h2>Approval</h2>
        <div class="grid">
          <div class="field">
            <label for="applicant-name">Applicant Name:</label>
            <input id="applicant-name" name="applicantName" type="text">
          </div>

          <div class="field">
            <label for="submission-date">Request Submission Date:</label>
            <input id="submission-date" name="submissionDate" type="date">
          </div>
        </div>
      </section>

      <section>
        <h2>Service Personnel</h2>
        <div class="grid">
          <div class="field">
            <label for="completed-by">Completed By:</label>
            <input id="completed-by" name="completedBy" type="text">
          </div>

          <div class="field">
            <label for="completed-date">Date:</label>
            <input id="completed-date" name="completedDate" type="date">
          </div>

          <div class="field">
            <label for="approved-by">Approved By:</label>
            <input id="approved-by" name="approvedBy" type="text">
          </div>

          <div class="field">
            <label for="approved-date">Date:</label>
            <input id="approved-date" name="approvedDate" type="date">
          </div>
        </div>
      </section>
    </form>
   </main>
  
</body>
</html>
